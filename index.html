    <style>
      html, body { margin: 0; background: #0c0c0c; color: #d7e2ea; }
      #splash {
        position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px; background: #0c0c0c;
        transition: opacity 0.6s ease; font-family: 'Kanit', system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      #splash .name {
        font-family: 'Archivo Black', 'Kanit', system-ui, sans-serif; font-size: clamp(28px, 6vw, 64px);
        letter-spacing: -0.01em; text-transform: uppercase;
        background: linear-gradient(180deg, #646973 0%, #bbccd7 100%);
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      }
      #splash .role { font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase; color: rgba(215, 226, 234, 0.6); }
      #splash .bar { width: 160px; height: 2px; border-radius: 2px; background: rgba(215, 226, 234, 0.12); overflow: hidden; }
      #splash .bar::after {
        content: ''; display: block; width: 40%; height: 100%; border-radius: 2px;
        background: linear-gradient(90deg, #b600a8, #7621b0, #be4c00); animation: splash-bar 1.1s ease-in-out infinite;
      }
      @keyframes splash-bar { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #splash .bar::after { animation: none; width: 100%; } }
    </style>
